<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Portefeuille Euronext</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; background-color: #f8f9fa; color: #333; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #edf2f7; }
        th { background-color: #f1f5f9; font-weight: 600; }
        .positif { color: #2ecc71; font-weight: bold; }
        .negatif { color: #e74c3c; font-weight: bold; }
        .total-card { background: #2c3e50; color: white; padding: 20px; border-radius: 8px; display: inline-block; min-width: 250px; }
        .total-val { font-size: 1.8em; font-weight: bold; margin-top: 5px; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <h1>Visualisation de ma Position Euronext</h1>
    
    <button onclick="actualiserPortefeuille()">🔄 Actualiser le cours</button>

    <table>
        <thead>
            <tr>
                <th>Nom / Ticker</th>
                <th>Quantité</th>
                <th>Prix d'achat</th>
                <th>Cours Actuel</th>
                <th>Valeur Actuelle</th>
                <th>Plus/Moins-value</th>
            </tr>
        </thead>
        <tbody id="portfolio-table">
            </tbody>
    </table>

    <div class="total-card">
        <div>Valeur Totale du Portefeuille</div>
        <div class="total-val" id="total-portefeuille">--.-- €</div>
    </div>

    <script>
        // 1. VOS DONNÉES REELLES (Exemple : 15 parts achetées à 150.50 €)
        // ANX.PA est le symbole Yahoo Finance pour l'Amundi Nasdaq 100 (Acc) sur Euronext Paris
        const mesPositions = [
            { 
                nom: 'Amundi Nasdaq 100 Acc (Euronext)', 
                ticker: 'ANX.PA', 
                quantite: 1224, 
                prixAchat: 93.045
            }
        ];

        // Utilisation d'une API publique légère pour récupérer les données Yahoo Finance directement en HTML
        async function obtenirCoursEuronext(ticker) {
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Extraction du prix le plus récent (Regular Market Price)
                const meta = data.chart.result[0].meta;
                return meta.regularMarketPrice;
            } catch (error) {
                console.error(`Erreur de récupération pour ${ticker}:`, error);
                return null;
            }
        }

        async function actualiserPortefeuille() {
            const tbody = document.getElementById('portfolio-table');
            tbody.innerHTML = '<tr><td colspan="6">Mise à jour du cours...</td></tr>';
            
            let htmlContenu = '';
            let valeurTotalePortefeuille = 0;

            for (let position of mesPositions) {
                const coursActuel = await obtenirCoursEuronext(position.ticker);
                
                if (coursActuel) {
                    const valeurActuelle = coursActuel * position.quantite;
                    const valeurInitiale = position.prixAchat * position.quantite;
                    const plusValue = valeurActuelle - valeurInitiale;
                    const performancePourcent = ((coursActuel - position.prixAchat) / position.prixAchat) * 100;

                    valeurTotalePortefeuille += valeurActuelle;

                    const classeStyle = plusValue >= 0 ? 'positif' : 'negatif';
                    const signe = plusValue >= 0 ? '+' : '';

                    htmlContenu += `
                        <tr>
                            <td><strong>${position.nom}</strong> <br><small style="color:#7f8c8d">${position.ticker}</small></td>
                            <td>${position.quantite}</td>
                            <td>${position.prixAchat.toFixed(2)} €</td>
                            <td>${coursActuel.toFixed(2)} €</td>
                            <td>${valeurActuelle.toFixed(2)} €</td>
                            <td class="${classeStyle}">${signe}${plusValue.toFixed(2)} € (${signe}${performancePourcent.toFixed(2)}%)</td>
                        </tr>
                    `;
                } else {
                    htmlContenu += `
                        <tr>
                            <td><strong>${position.nom}</strong></td>
                            <td colspan="5" style="color: red;">Erreur lors de la récupération du cours Euronext</td>
                        </tr>
                    `;
                }
            }

            tbody.innerHTML = htmlContenu;
            document.getElementById('total-portefeuille').innerText = `${valeurTotalePortefeuille.toFixed(2)} €`;
        }

        // Chargement automatique
        actualiserPortefeuille();
    </script>
</body>
</html>
