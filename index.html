<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLEAU DE BORD PEA - GÉANT</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
        }

        body {
            font-family: 'Impact', 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- GRANDS BLOCS DE PERF (PREND BEAUCOUP DE PLACE) --- */
        .grid-blocks {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .giant-card {
            background-color: var(--card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 2px solid #334155;
            text-align: center;
        }

        .label {
            font-size: 1.2rem;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 2px;
            font-family: 'Segoe UI', sans-serif;
        }

        .value {
            font-size: 3.5rem;
            font-weight: bold;
            margin-top: 10px;
        }

        /* --- COULEURS DES GAINS --- */
        .txt-green { color: var(--green); }
        .txt-red { color: var(--red); }

        /* --- ZONE GRAPHIQUE --- */
        .chart-box {
            background-color: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #334155;
            margin-bottom: 40px;
        }

        .chart-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.2s;
        }

        .btn:hover { background-color: #475569; }
        .btn.active { background-color: var(--blue); }

        /* --- PANNEAU DE SECOURS MANUEL --- */
        .fallback-box {
            background-color: #1e1b4b;
            border: 2px dashed #4338ca;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            margin-bottom: 40px;
        }

        .fallback-box input {
            background: #312e81;
            border: 1px solid #4338ca;
            color: white;
            padding: 10px;
            font-size: 1.2rem;
            border-radius: 8px;
            width: 120px;
            text-align: center;
            font-weight: bold;
        }

        /* --- INFOS BRUTES --- */
        .raw-table {
            width: 100%;
            font-family: 'Segoe UI', sans-serif;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 15px;
            overflow: hidden;
        }

        .raw-table th, .raw-table td {
            padding: 20px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .raw-table th { background: #111827; color: var(--muted); }
    </style>
</head>
<body>

    <div class="container">
        
        <h1 style="font-size: 2.5rem; margin-bottom: 30px; text-align: center; letter-spacing: 2px;">⚡ PORTFOLIO NASDAQ 100 ⚡</h1>

        <div class="fallback-box">
            <span>🛠️ En cas de bug de l'API automatique, forcez le prix ici en direct : </span>
            <input type="number" id="manual-price" step="0.01" placeholder="Ex: 102.5" oninput="forcerCoursManuel(this.value)"> <span>€</span>
        </div>

        <div class="grid-blocks">
            <div class="giant-card">
                <div class="label">Valeur Actuelle</div>
                <div class="value id-green" id="box-val-totale">-- €</div>
            </div>
            <div class="giant-card">
                <div class="label">Plus/Moins-Value Globale</div>
                <div class="value" id="box-gain-total">-- €</div>
            </div>
            <div class="giant-card">
                <div class="label">Cours du Nasdaq ETF</div>
                <div class="value style="color: var(--blue);" id="box-cours-actuel">-- €</div>
            </div>
        </div>

        <div class="chart-box">
            <div class="chart-buttons">
                <button class="btn active" onclick="changerPeriode('1d', '1m', this)">INTRADAY</button>
                <button class="btn" onclick="changerPeriode('1mo', '1d', this)">1 MOIS</button>
                <button class="btn" onclick="changerPeriode('3mo', '1d', this)">1 TRIMESTRE</button>
                <button class="btn" onclick="changerPeriode('1y', '1d', this)">1 AN</button>
            </div>
            <div style="position: relative; height: 350px;">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <table class="raw-table">
            <thead>
                <tr>
                    <th>Actif</th>
                    <th>Quantité</th>
                    <th>Prix Achat Moyen</th>
                    <th>Total Investi</th>
                    <th>Statut API</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>Amundi Nasdaq 100 Acc (ANX.PA)</strong></td>
                    <td>1 224</td>
                    <td>93,045 €</td>
                    <td id="tab-investi">-- €</td>
                    <td id="tab-status" style="color: orange;">Connexion...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script>
        // CONFIGURATION FIXE DE VOS DONNÉES
        const QUANTITE = 1224;
        const PRIX_ACHAT = 93.045;
        const TICKER = 'ANX.PA';
        const TOTAL_INVESTI = QUANTITE * PRIX_ACHAT;

        let chartInstance = null;
        let dernierCoursSauvegarde = 0;

        document.getElementById('tab-investi').innerText = TOTAL_INVESTI.toFixed(2) + " €";

        // CALCULS GENERAUX ET AFFICHAGE BRUT
        function recalculerTout(cours) {
            dernierCoursSauvegarde = cours;
            const valeurActuelle = cours * QUANTITE;
            const plusValue = valeurActuelle - TOTAL_INVESTI;
            const perfPourcent = (plusValue / TOTAL_INVESTI) * 100;

            // Remplissage des blocs géants
            document.getElementById('box-cours-actuel').innerText = cours.toFixed(2) + " €";
            document.getElementById('box-val-totale').innerText = valeurActuelle.toFixed(2) + " €";
            
            const boxGain = document.getElementById('box-gain-total');
            const signe = plusValue >= 0 ? '+' : '';
            boxGain.innerText = `${signe}${plusValue.toFixed(2)} € (${signe}${perfPourcent.toFixed(2)}%)`;
            
            if (plusValue >= 0) {
                boxGain.className = "value txt-green";
            } else {
                boxGain.className = "value txt-red";
            }
        }

        // FORCE MANUELLE
        function forceNoCorsCalcul() {
             recalculerTout(98.50); // Fallback arbitraire au démarrage si l'API met du temps
        }

        function forcerCoursManuel(valeur) {
            const prix = parseFloat(valeur);
            if (prix > 0) {
                document.getElementById('tab-status').innerText = "Mode Manuel 🛠️";
                document.getElementById('tab-status').style.color = "#3b82f6";
                recalculerTout(prix);
            }
        }

        // INTEGRATION DU PROXY ANTI-BLOCAGE CORS
        async function fetchYahooData(range, interval) {
            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${TICKER}?range=${range}&interval=${interval}`;
            // Allorigins récupère le flux sans blocage de domaine
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`;
            
            const response = await fetch(proxyUrl);
            const data = await response.json();
            // Le contenu brut renvoyé par le proxy est une chaîne qu'on repasse en JSON
            return JSON.parse(data.contents);
        }

        async function chargerDonneesAutomatiques() {
            try {
                const json = await fetchYahooData('1d', '1m');
                const result = json.chart.result[0];
                const coursActuel = result.meta.regularMarketPrice;
                
                document.getElementById('tab-status').innerText = "Connecté ✅";
                document.getElementById('tab-status').style.color = "#10b981";
                
                recalculerTout(coursActuel);
                tracerGraphique(result.timestamp, result.indicators.quote[0].close, '1d');
            } catch (err) {
                console.error(err);
                document.getElementById('tab-status').innerText = "Erreur Proxy - Mode démo activé";
                document.getElementById('tab-status').style.color = "#ef4444";
                forceNoCorsCalcul();
            }
        }

        // DESSIN DU GRAPHIQUE
        function tracerGraphique(timestamps, prix, range) {
            if(!timestamps || !prix) return;

            const labels = timestamps.map(ts => {
                const d = new Date(ts * 1000);
                return range === '1d' ? d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : d.toLocaleDateString([], {day: '2-digit', month: '2-digit'});
            });

            const prixNettoyes = prix.map((p, i) => p || prix[i-1] || PRIX_ACHAT);

            if (chartInstance) { chartInstance.destroy(); }

            const ctx = document.getElementById('mainChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: prixNettoyes,
                        borderColor: '#3b82f6',
                        borderWidth: 3,
                        pointRadius: range === '1d' ? 0 : 2,
                        fill: false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8', maxTicksLimit: 10 }, grid: { display: false } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        async function changerPeriode(range, interval, bouton) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            bouton.classList.add('active');
            try {
                const json = await fetchYahooData(range, interval);
                const result = json.chart.result[0];
                tracerGraphique(result.timestamp, result.indicators.quote[0].close, range);
            } catch(e) {
                console.log("Erreur de changement de période");
            }
        }

        // Lancement au chargement de la page
        chargerDonneesAutomatiques();
    </script>
</body>
</html>
